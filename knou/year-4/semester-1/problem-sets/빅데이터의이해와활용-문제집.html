const MARKS = ["①","②","③","④","⑤"];
function render() {
  const qEl = document.getElementById("questions");
  const xEl = document.getElementById("explain");
  let qs = "", grid = "", ex = "";
  QUESTIONS.forEach((q, i) => {
    const n = i + 1;
    const ans = q.answerText || MARKS[q.answer - 1];
    if (q.section) qs += `<p class="section">※ ${q.section}</p>`;
    qs += `<div class="q"><p class="stem"><span class="no">${n}.</span>${q.stem}${q.choices ? "" : ` <span class="note">${q.note}</span>`}</p>`;
    if (q.figure) qs += q.figure;
    if (q.box) qs += `<div class="box">${q.box.map(l => `<p>${l}</p>`).join("")}</div>`;
    if (q.choices) {
      qs += `<ol class="choices">${q.choices.map((c, j) =>
        `<li class="${j + 1 === q.answer ? "answer" : ""}"><span class="mark">${MARKS[j]}</span> ${c}${j === q.choices.length - 1 ? ` <span class="note">${q.note}</span>` : ""}</li>`).join("")}</ol>`;
    } else {
      qs += `<p class="note" style="margin:4px 0 0 14px;font-size:13px">정답: ${ans}</p>`;
    }
    qs += `</div>`;
    grid += `<span>${n}. ${ans}</span>`;
    ex += `<div class="item"><h4>${n}번 &nbsp;정답 ${ans}</h4><p>${q.explain}</p></div>`;
  });
  qs += `<div class="final"><h3>정답 (풀이노트)</h3><div class="grid">${grid}</div><small>※ 개념 요약·상세 풀이는 뒤 풀이노트 페이지 참고</small></div>`;
  qEl.innerHTML = qs;
  xEl.innerHTML = `<h2>풀이노트 – 빅데이터의이해와활용 (1~${QUESTIONS.length})</h2>` + ex;
  document.getElementById("range").textContent = `(1~${QUESTIONS.length})`;
}
render();

document.getElementById("toggle").addEventListener("click", e => {
  const hidden = document.body.classList.toggle("hide-answers");
  e.target.textContent = hidden ? "정답 보기" : "정답 숨기기";
});
window.addEventListener("load", () => {
  if (window.renderMathInElement) renderMathInElement(document.body, {
    delimiters: [{ left: "$", right: "$", display: false }], throwOnError: false
  });
});
